<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Navy Obsidian Shield Background -->
  <rect width="64" height="64" rx="14" fill="#0B0F19" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#1E293B" stroke-width="2" />
  
  <!-- Subtle Glowing Grid Accent -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="32" y1="8" x2="32" y2="56" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Dynamic Risk Pulse Sine Wave (Cyan to Emerald Gradient) -->
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Financial Risk Pulse Path -->
  <path d="M 10 34 L 20 34 L 25 18 L 31 46 L 37 26 L 43 38 L 47 34 L 54 34" 
        stroke="url(#pulseGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Pulse Beacon Dots -->
  <circle cx="31" cy="46" r="3" fill="#38BDF8" />
  <circle cx="25" cy="18" r="3" fill="#10B981" />
</svg>
